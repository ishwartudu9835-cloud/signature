<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cowartu Email Signature Templates</title>
<style>
  body{margin:0;background:#EEF0F5;font-family:'Segoe UI',Arial,sans-serif;color:#12264F;}
  .wrap{max-width:560px;margin:0 auto;padding:28px 16px 60px;}
  h1{font-size:24px;margin:0 0 6px;}
  .lead{color:#5a6478;font-size:14px;margin:0 0 20px;line-height:21px;}
  .tabs{display:flex;gap:8px;margin-bottom:22px;position:sticky;top:0;padding:10px 0;background:#EEF0F5;z-index:5;}
  .tab{flex:1;padding:12px 8px;border:2px solid #12264F;border-radius:10px;background:#fff;color:#12264F;font-weight:700;font-size:14px;cursor:pointer;}
  .tab.on{background:#12264F;color:#fff;}
  .item{margin-bottom:26px;}
  .meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:10px;}
  .meta b{font-size:14px;}
  .meta span.n{color:#B8872B;margin-right:6px;}
  .copy{background:#D4A843;color:#0A1A3C;border:0;border-radius:8px;padding:9px 16px;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap;}
  .copy.ok{background:#1a7f37;color:#fff;}
  .stage{background:#fff;border-radius:12px;padding:16px;overflow:hidden;box-shadow:0 1px 3px rgba(10,26,60,.08);}
  .dark-stage{background:#fff;}
  .sig{display:block;max-width:460px;}
  .hint{background:#fff;border:1px dashed #D4A843;border-radius:10px;padding:12px 14px;font-size:13px;color:#444;line-height:20px;margin-bottom:18px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Cowartu Email Signatures</h1>
  <p class="lead">13 premium templates. Pehle upar se Ishwar ya Cowartu Support chuniye, phir pasand ka design <b>Copy</b> karke GoDaddy Email &rarr; Settings &rarr; Signature mein paste kijiye.</p>
  <div class="hint"><b>Dhyaan:</b> copy hosted link se hi karein (local file se nahi), warna images dusre ke email mein nahi dikhengi.</div>
  <div class="tabs">
    <button class="tab on" data-p="ishwar">Ishwar Tudu</button>
    <button class="tab" data-p="support">Cowartu Support</button>
  </div>
  <div id="list"></div>
</div>

<script>
/* ================== DATA ================== */
var NAVY='#12264F', DK='#0A1A3C', GOLD='#D4A843', GOLD2='#B8872B';
var SOCIAL_URL={instagram:'https://instagram.com/cowartu_in',whatsapp:'https://wa.me/919279044047',youtube:'https://youtube.com/@cowartu_in',linkedin:'https://linkedin.com/company/cowartu'};
var PROFILES={
  ishwar:{
    name:'Ishwar Tudu', role:'Founder', company:'Cowartu', phone:null,
    email:'ishwar@cowartu.com', web:'www.cowartu.com', webUrl:'https://www.cowartu.com',
    imgSq:'ishwar-sq.png', imgCircle:'ishwar-circle.png',
    socials:[['instagram','https://www.instagram.com/_ishwar_tudu'],['linkedin','https://www.linkedin.com/in/ishwar-tudu-']]
  },
  support:{
    name:'Cowartu Support', role:null, company:null, tagline:'Join the Voice Revolution',
    phone:'+91 92790 44047', phoneUrl:'tel:+919279044047',
    email:'support@cowartu.com', web:'www.cowartu.com', webUrl:'https://www.cowartu.com',
    imgSq:'logo-sq.png', imgCircle:'logo-circle.png',
    socials:[['instagram',SOCIAL_URL.instagram],['whatsapp',SOCIAL_URL.whatsapp],['youtube',SOCIAL_URL.youtube],['linkedin',SOCIAL_URL.linkedin]]
  }
};

/* ================== HELPERS ================== */
function img(src,w,h,alt,extra){return '<img src="images/'+src+'" width="'+w+'" height="'+h+'" alt="'+(alt||'')+'" style="display:block;border:0;width:'+w+'px;height:'+h+'px;'+(extra||'')+'">';}
function subHtml(p,dark){
  var gold=dark?GOLD:GOLD2, sep=dark?'#6F7FA3':'#BDBDBD';
  if(p.role) return p.role+' <span style="color:'+sep+';">|</span> <span style="color:'+gold+';font-weight:700;">'+p.company+'</span>';
  return '<span style="color:'+gold+';font-weight:700;">'+p.tagline+'</span>';
}
function items(p){
  var a=[];
  if(p.phone) a.push(['phone',p.phone,p.phoneUrl]);
  a.push(['mail',p.email,'mailto:'+p.email]);
  a.push(['web',p.web,p.webUrl]);
  return a;
}
/* contact rows with icon  ic: d,n,g,w */
function rows(p,o){
  o=o||{};var iw=o.iw||20,sz=o.size||13,h=o.h||28,al=o.align||'left';
  var out='<table cellpadding="0" cellspacing="0" border="0" '+(al=='center'?'align="center" ':'')+'style="border-collapse:collapse;">';
  items(p).forEach(function(i){
    out+='<tr><td width="'+(iw+4)+'" height="'+h+'" valign="middle">'+img(o.ic+'-'+i[0]+'.png',iw,iw,i[0])+'</td>'+
    '<td valign="middle" style="padding-left:8px;font-size:'+sz+'px;"><a href="'+i[2]+'" style="color:'+(o.color||'#1A1A1A')+';text-decoration:none;">'+i[1]+'</a></td></tr>';
  });
  return out+'</table>';
}
function socials(p,o){
  o=o||{};var s=o.size||22,g=o.gap||6,al=o.align||'left';
  var out='<table cellpadding="0" cellspacing="0" border="0" '+(al=='center'?'align="center" ':'')+'style="border-collapse:collapse;"><tr>';
  p.socials.forEach(function(x,i){
    out+='<td style="padding-right:'+(i<p.socials.length-1?g:0)+'px;"><a href="'+x[1]+'">'+img(o.ic+'-'+x[0]+'.png',s,s,x[0])+'</a></td>';
  });
  return out+'</tr></table>';
}
function card(inner,o){
  o=o||{};
  return '<table cellpadding="0" cellspacing="0" border="0" width="100%" bgcolor="'+(o.bg||'#FFFFFF')+'" style="width:100%;max-width:'+(o.w||460)+'px;background:'+(o.bg||'#FFFFFF')+';'+(o.border===false?'':'border:'+(o.border||'1px solid #E6E6E6')+';')+'border-radius:'+(o.r==null?12:o.r)+'px;border-collapse:separate;font-family:\'Segoe UI\',Arial,Helvetica,sans-serif;">'+inner+'</table>';
}
var DIV='<div style="height:1px;background:#E4E4E4;margin:9px 0 7px 0;line-height:1px;font-size:0;">&nbsp;</div>';
function divDark(c){return '<div style="height:1px;background:'+(c||'#2A3C63')+';margin:9px 0 7px 0;line-height:1px;font-size:0;">&nbsp;</div>';}
function nameDiv(t,c,s){return '<div style="font-size:'+(s||19)+'px;font-weight:800;color:'+c+';line-height:24px;">'+t+'</div>';}
function subDiv(h,c,s,mt){return '<div style="font-size:'+(s||13)+'px;color:'+c+';margin-top:'+(mt==null?2:mt)+'px;line-height:19px;">'+h+'</div>';}
function strip(c,h){return '<tr><td colspan="9" height="'+h+'" bgcolor="'+c+'" style="height:'+h+'px;line-height:'+h+'px;font-size:0;background:'+c+';">&nbsp;</td></tr>';}

/* ================== TEMPLATES ================== */
var T=[];

/* 1 Classic White */
T.push({name:'Classic White',r:function(p){
  return card('<tr><td width="100" valign="top" style="width:100px;padding:16px 0 16px 16px;">'+img(p.imgSq,80,80,p.name,'border-radius:12px;')+'<div style="height:10px;line-height:10px;font-size:0;">&nbsp;</div>'+socials(p,{ic:'sq'})+'</td>'+
  '<td valign="top" style="padding:16px 16px 14px 8px;">'+nameDiv(p.name,'#1A1A1A')+subDiv(subHtml(p,false),'#333')+DIV+rows(p,{ic:'d'})+'</td></tr>');
}});

/* 2 Navy Gold */
T.push({name:'Navy Gold',r:function(p){
  return card(strip(GOLD,3)+'<tr><td width="108" valign="middle" align="center" style="width:108px;padding:18px 0 18px 16px;">'+img(p.imgCircle,84,84,p.name)+'</td>'+
  '<td valign="middle" style="padding:16px 16px 16px 12px;">'+nameDiv(p.name,'#F4F1EA')+subDiv(subHtml(p,true),'#C9CEDB')+divDark()+rows(p,{ic:'g',color:'#F4F1EA'})+'<div style="height:6px;line-height:6px;font-size:0;">&nbsp;</div>'+socials(p,{ic:'gc',size:24})+'</td></tr>'+strip(GOLD,3),{bg:DK,border:false,r:0});
}});

/* 3 Minimal Line */
T.push({name:'Minimal Line',r:function(p){
  var lines=items(p).map(function(i){var l={phone:'T',mail:'E',web:'W'}[i[0]];return '<div style="font-size:13px;line-height:22px;color:#1A1A1A;"><span style="color:'+GOLD2+';font-weight:800;display:inline-block;width:18px;">'+l+'</span><a href="'+i[2]+'" style="color:#1A1A1A;text-decoration:none;">'+i[1]+'</a></div>';}).join('');
  var soc=p.socials.map(function(x){return '<a href="'+x[1]+'" style="color:'+NAVY+';font-weight:700;text-decoration:none;">'+x[0].charAt(0).toUpperCase()+x[0].slice(1)+'</a>';}).join(' <span style="color:#BDBDBD;">&middot;</span> ');
  return card('<tr><td width="4" bgcolor="'+GOLD+'" style="width:4px;background:'+GOLD+';font-size:0;">&nbsp;</td><td style="padding:6px 0 6px 16px;">'+nameDiv(p.name,NAVY,20)+subDiv(subHtml(p,false),'#333',13,0)+'<div style="height:8px;line-height:8px;font-size:0;">&nbsp;</div>'+lines+'<div style="font-size:12px;line-height:22px;margin-top:4px;">'+soc+'</div></td></tr>',{bg:'#FFFFFF',border:false,r:0});
}});

/* 4 Banner */
T.push({name:'Banner Strip',r:function(p){
  return card('<tr><td style="padding:16px 16px 12px 16px;"><table cellpadding="0" cellspacing="0" border="0"><tr><td width="68" valign="middle">'+img(p.imgCircle,60,60,p.name)+'</td><td valign="middle" style="padding-left:10px;">'+nameDiv(p.name,NAVY,19)+subDiv(subHtml(p,false),'#333')+'</td></tr></table></td></tr>'+
  '<tr><td bgcolor="'+DK+'" style="background:'+DK+';padding:12px 16px;border-radius:0 0 11px 11px;">'+rows(p,{ic:'g',color:'#F4F1EA',h:26,iw:18,size:12.5})+'<div style="height:6px;line-height:6px;font-size:0;">&nbsp;</div>'+socials(p,{ic:'gc',size:22})+'</td></tr>');
}});

/* 5 Cream Gold */
T.push({name:'Cream Gold',r:function(p){
  return card('<tr><td width="4" bgcolor="'+GOLD+'" style="width:4px;background:'+GOLD+';font-size:0;border-radius:12px 0 0 12px;">&nbsp;</td><td width="98" valign="top" style="width:98px;padding:16px 0 16px 14px;">'+img(p.imgCircle,76,76,p.name)+'<div style="height:10px;line-height:10px;font-size:0;">&nbsp;</div>'+socials(p,{ic:'gc',size:20,gap:4})+'</td>'+
  '<td valign="top" style="padding:16px 16px 14px 6px;">'+nameDiv(p.name,NAVY)+subDiv(subHtml(p,false),'#4a4a4a')+'<div style="height:1px;background:#E8DDBF;margin:9px 0 7px 0;line-height:1px;font-size:0;">&nbsp;</div>'+rows(p,{ic:'g',color:'#1A1A1A'})+'</td></tr>',{bg:'#FBF7EC',border:'1px solid #EFE4C4'});
}});

/* 6 Dark Split */
T.push({name:'Dark Split',r:function(p){
  return card('<tr><td width="124" valign="middle" align="center" bgcolor="'+DK+'" style="width:124px;background:'+DK+';padding:18px 8px;border-radius:12px 0 0 12px;">'+img(p.imgCircle,80,80,p.name,'margin:0 auto;')+'<div style="height:10px;line-height:10px;font-size:0;">&nbsp;</div>'+socials(p,{ic:'gc',size:20,gap:4,align:'center'})+'</td>'+
  '<td valign="middle" style="padding:16px 16px 14px 14px;">'+nameDiv(p.name,NAVY)+subDiv(subHtml(p,false),'#333')+DIV+rows(p,{ic:'n'})+'</td></tr>',{border:'1px solid #D9DEEA'});
}});

/* 7 Centered Stack */
T.push({name:'Centered Stack',r:function(p){
  return card('<tr><td align="center" style="padding:18px 16px;text-align:center;">'+img(p.imgCircle,84,84,p.name,'margin:0 auto;')+'<div style="height:8px;line-height:8px;font-size:0;">&nbsp;</div>'+nameDiv(p.name,NAVY,20)+subDiv(subHtml(p,false),'#333')+
  '<div style="width:34px;height:2px;background:'+GOLD+';margin:10px auto 8px;line-height:2px;font-size:0;">&nbsp;</div>'+rows(p,{ic:'n',align:'center',h:26,iw:18,size:12.5})+'<div style="height:8px;line-height:8px;font-size:0;">&nbsp;</div>'+socials(p,{ic:'nc',size:24,align:'center'})+'</td></tr>',{w:360});
}});

/* 8 Header Band */
T.push({name:'Header Band',r:function(p){
  return card('<tr><td colspan="2" bgcolor="'+DK+'" style="background:'+DK+';padding:14px 18px;border-radius:11px 11px 0 0;">'+nameDiv(p.name,'#FFFFFF',20)+subDiv(subHtml(p,true),'#C9CEDB',13,1)+'</td></tr>'+
  '<tr><td valign="top" style="padding:14px 8px 14px 18px;">'+rows(p,{ic:'n',h:26,iw:18,size:12.5})+'<div style="height:8px;line-height:8px;font-size:0;">&nbsp;</div>'+socials(p,{ic:'nc',size:22})+'</td><td width="100" valign="middle" align="right" style="width:100px;padding:14px 18px 14px 0;">'+img(p.imgSq,78,78,p.name,'border-radius:12px;margin-left:auto;')+'</td></tr>');
}});

/* 9 Soft Pills */
T.push({name:'Soft Pills',r:function(p){
  var pills=items(p).map(function(i){return '<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate;margin-bottom:5px;"><tr><td bgcolor="#FFFFFF" style="background:#FFFFFF;border-radius:20px;padding:4px 12px 4px 5px;"><table cellpadding="0" cellspacing="0" border="0"><tr><td width="24" valign="middle">'+img('n-'+i[0]+'.png',20,20,i[0])+'</td><td valign="middle" style="padding-left:6px;font-size:12.5px;"><a href="'+i[2]+'" style="color:#1A1A1A;text-decoration:none;">'+i[1]+'</a></td></tr></table></td></tr></table>';}).join('');
  return card('<tr><td width="96" valign="top" style="width:96px;padding:16px 0 16px 16px;">'+img(p.imgSq,76,76,p.name,'border-radius:12px;')+'<div style="height:10px;line-height:10px;font-size:0;">&nbsp;</div>'+socials(p,{ic:'sq',size:20,gap:4})+'</td>'+
  '<td valign="top" style="padding:14px 14px 10px 8px;">'+nameDiv(p.name,NAVY)+subDiv(subHtml(p,false),'#333')+'<div style="height:8px;line-height:8px;font-size:0;">&nbsp;</div>'+pills+'</td></tr>',{bg:'#F2F4F8',border:'1px solid #E1E5EE'});
}});

/* 10 Gold Top Edge */
T.push({name:'Gold Edge',r:function(p){
  return card(strip(GOLD,6)+'<tr><td valign="top" style="padding:16px 8px 16px 18px;">'+nameDiv(p.name,NAVY,20)+subDiv(subHtml(p,false),'#333')+DIV+rows(p,{ic:'g'})+'</td><td width="104" valign="top" align="right" style="width:104px;padding:16px 18px 16px 0;">'+img(p.imgSq,84,84,p.name,'border-radius:12px;margin-left:auto;')+'<div style="height:10px;line-height:10px;font-size:0;">&nbsp;</div>'+socials(p,{ic:'sq',size:20,gap:4})+'</td></tr>',{border:'1px solid #E6E6E6',r:0});
}});

/* 11 Compact */
T.push({name:'Compact One-liner',r:function(p){
  var links=items(p).filter(function(i){return i[0]!='phone';}).map(function(i){return '<a href="'+i[2]+'" style="color:'+NAVY+';text-decoration:none;">'+i[1]+'</a>';});
  if(p.phone) links.unshift('<a href="'+p.phoneUrl+'" style="color:'+NAVY+';text-decoration:none;">'+p.phone+'</a>');
  return card('<tr><td width="56" valign="middle" style="width:56px;padding:12px 0 12px 14px;">'+img(p.imgCircle,44,44,p.name)+'</td><td valign="middle" style="padding:10px 14px 10px 10px;"><div style="font-size:14px;line-height:20px;color:#1A1A1A;"><b style="color:'+NAVY+';">'+p.name+'</b> <span style="color:#BDBDBD;">|</span> '+subHtml(p,false)+'</div><div style="font-size:12px;line-height:19px;">'+links.join(' <span style="color:#BDBDBD;">&middot;</span> ')+'</div><div style="height:5px;line-height:5px;font-size:0;">&nbsp;</div>'+socials(p,{ic:'nc',size:18,gap:4})+'</td></tr>',{border:'1px solid #E6E6E6'});
}});

/* 12 Dark Premium */
T.push({name:'Dark Premium',r:function(p){
  return card('<tr><td width="4" bgcolor="'+GOLD+'" style="width:4px;background:'+GOLD+';font-size:0;">&nbsp;</td><td valign="top" style="padding:18px 8px 18px 18px;">'+nameDiv(p.name,'#FFFFFF',20)+subDiv(subHtml(p,true),'#C9CEDB')+divDark()+rows(p,{ic:'w',color:'#F4F1EA'})+'<div style="height:8px;line-height:8px;font-size:0;">&nbsp;</div>'+socials(p,{ic:'wc',size:22})+'</td><td width="108" valign="middle" align="center" style="width:108px;padding:14px 16px 14px 4px;">'+img(p.imgCircle,88,88,p.name)+'</td></tr>',{bg:DK,border:false,r:0});
}});

/* 13 Navy Outline */
T.push({name:'Navy Outline',r:function(p){
  return card('<tr><td width="96" valign="top" style="width:96px;padding:16px 0 12px 16px;">'+img(p.imgCircle,76,76,p.name)+'<div style="height:10px;line-height:10px;font-size:0;">&nbsp;</div>'+socials(p,{ic:'nc',size:20,gap:4})+'</td>'+
  '<td valign="top" style="padding:16px 16px 12px 8px;">'+nameDiv(p.name,NAVY)+subDiv(subHtml(p,false),'#333')+'<div style="height:2px;width:34px;background:'+GOLD+';margin:9px 0 7px;line-height:2px;font-size:0;">&nbsp;</div>'+rows(p,{ic:'n'})+'</td></tr>'+strip(GOLD,4),{border:'2px solid '+NAVY,r:10});
}});

/* ================== RENDER ================== */
var cur='ishwar';
function render(){
  var list=document.getElementById('list');list.innerHTML='';
  T.forEach(function(t,i){
    var d=document.createElement('div');d.className='item';
    d.innerHTML='<div class="meta"><b><span class="n">'+(i+1)+'.</span>'+t.name+'</b><button class="copy">Copy</button></div><div class="stage"><div class="sig">'+t.r(PROFILES[cur])+'</div></div>';
    list.appendChild(d);
    d.querySelector('.copy').onclick=function(){
      var btn=this,el=d.querySelector('.sig'),r=document.createRange();r.selectNode(el);
      var s=window.getSelection();s.removeAllRanges();s.addRange(r);
      var ok=false;try{ok=document.execCommand('copy');}catch(e){}
      s.removeAllRanges();
      btn.textContent=ok?'Copy ho gaya!':'Ctrl+C dabayein';btn.className='copy ok';
      setTimeout(function(){btn.textContent='Copy';btn.className='copy';},2000);
    };
  });
}
document.querySelectorAll('.tab').forEach(function(b){
  b.onclick=function(){cur=b.getAttribute('data-p');document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x===b);});render();location.hash=cur;};
});
if(location.hash=='#support'){cur='support';document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-p')=='support');});}
render();
</script>
</body>
</html>
